<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
  <title id="t">Núcleo Vivo</title>
  <desc id="d">Logotipo tridimensional de Núcleo Vivo en coral y ciruela.</desc>
  <defs>
