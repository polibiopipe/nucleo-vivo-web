    <text x="305" y="176" font-family="Commissioner,Arial Rounded MT Bold,Arial,sans-serif" font-size="86" font-weight="650" letter-spacing="-3" fill="none" stroke="#A56E95" stroke-opacity=".28" stroke-width="1.4">núcleo vivo</text>
