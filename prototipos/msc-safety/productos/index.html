<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSC Safety · Productos y variantes</title><style>:root{--red:#c91f2b;--blue:#0f5b6e;--ink:#202326;--muted:#737a80;--line:#d8dde1;--soft:#f4f5f6;--ok:#218d51;--bad:#c7473e}*{box-sizing:border-box}body{margin:0;font:14px/1.35 Arial,sans-serif;background:#f4f5f6;color:var(--ink)}button,input,select{font:inherit}.hidden{display:none!important}.login{max-width:380px;margin:10vh auto;background:#fff;padding:24px;border:1px solid var(--line);border-radius:12px}.login input{width:100%;padding:11px;margin:6px 0;border:1px solid #ccd2d6;border-radius:7px}.btn{border:0;border-radius:7px;background:var(--blue);color:#fff;padding:9px 12px;font-weight:700;cursor:pointer}.login .btn{width:100%}.top{position:sticky;top:0;z-index:20;background:#11171b;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}.top b{font-size:17px}.top a{color:#fff;text-decoration:none;border:1px solid #39434a;padding:7px 10px;border-radius:6px}.grow{flex:1}.wrap{max-width:1120px;margin:auto;padding:14px}.toolbar{display:grid;grid-template-columns:1fr 240px auto;gap:8px;margin-bottom:8px}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 10px;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:11px}.summary b{color:var(--ink)}.toolbar input,.toolbar select,.editgrid input,.editgrid select{width:100%;padding:10px;border:1px solid #cbd1d5;border-radius:7px;background:#fff}.group{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;overflow:hidden}.head{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}.pic{width:64px;height:64px;border:1px solid #e1e4e7;background:#f6f6f6;display:grid;place-items:center;overflow:hidden;font-size:10px}.pic img{width:100%;height:100%;object-fit:contain}.name{font-weight:800;font-size:16px}.meta,.small{font-size:11px;color:var(--muted)}.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.docs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 10px}.docs button,.docs span{border:1px solid #c8d0d4;background:#fff;padding:7px 9px;border-radius:7px;font-size:10px}.docs button{cursor:pointer;font-weight:800;color:var(--blue)}.docs .pending{color:#8a6b2a;background:#fffaf0;border-color:#dec991}.pill{padding:4px 7px;background:var(--soft);border:1px solid var(--line);border-radius:12px;font-size:10px}.ok{color:var(--ok)}.bad{color:var(--bad)}.body{border-top:1px solid var(--line);padding:10px 12px;background:#fafafa}.editgrid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:10px}.variants{overflow:auto}.variants table{width:100%;border-collapse:collapse;min-width:760px;background:#fff}.variants th,.variants td{padding:9px;border-bottom:1px solid #e5e8ea;text-align:left}.variants th{font-size:10px;text-transform:uppercase;color:var(--muted);background:#f4f5f6}.sku{font-family:monospace}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:700px){.toolbar,.editgrid{grid-template-columns:1fr}.head{grid-template-columns:54px 1fr auto}.pic{width:54px;height:54px}}</style></head><body><section id="login" class="login"><h2>MSC Safety · Inventario</h2><form id="loginForm"><input id="email" type="email" placeholder="Correo" required><input id="password" type="password" placeholder="Contraseña" required><button class="btn">Ingresar</button></form><div id="loginMsg" class="small"></div></section><section id="app" class="hidden"><header class="top"><b>PRODUCTOS · VARIANTES</b><div class="grow"></div><a href="../gestion/">Gestión</a><a href="../ventas/">Ventas</a><button id="logout" class="btn">Salir</button></header><main class="wrap"><div class="toolbar"><input id="q" placeholder="Buscar producto padre, modelo, SKU o variante"><select id="cat"><option value="">Todas las categorías</option></select><button id="refresh" class="btn" type="button">Actualizar</button></div><div id="summary" class="summary"><span>Cargando catálogo…</span></div><div id="groups"><div class="empty">Cargando…</div></div></main></section><script>(function(){var BASE='',KEY='',token=sessionStorage.getItem('msc_token')||'',role='',G=[],V=[],CERT=[],open={},lastLoad=0,loading=false;function E(x){return document.getElementById(x)}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function money(v){return '$'+Math.round(Number(v||0)).toLocaleString('es-CL')}async function cfg(){var t=await fetch('../gestion/',{cache:'no-store'}).then(function(r){return r.text()});BASE=(t.match(/var SUPABASE_URL='([^']+)'/)||[])[1]||'';KEY=(t.match(/var SUPABASE_KEY='([^']+)'/)||[])[1]||'';if(!BASE||!KEY)throw Error('No se pudo iniciar conexión MSC')}async function api(p,o){o=o||{};o.cache='no-store';o.headers=Object.assign({apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json','Cache-Control':'no-cache'},o.headers||{});var r=await fetch(BASE+p,o),txt=await r.text(),d=txt?JSON.parse(txt):null;if(!r.ok)throw Error((d&&d.message)||('Error '+r.status));return d}async function enter(){var r=await fetch(BASE+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+token}}),u=await r.json();if(!r.ok)throw Error('Sesión no válida');role=(u.app_metadata&&u.app_metadata.msc_role)||'';if(['admin','bodega','supervisor'].indexOf(role)<0)throw Error('Sin permiso de inventario');E('login').classList.add('hidden');E('app').classList.remove('hidden');await load()}async function load(force){if(loading||(!force&&Date.now()-lastLoad<5000))return;loading=true;try{var r=await Promise.all([api('/rest/v1/msc_inventory_group_summary?select=*&order=name'),api('/rest/v1/msc_inventory_variant_detail?select=*&order=name'),api('/rest/v1/msc_product_certifications?select=*&order=updated_at.desc')]);G=r[0]||[];V=r[1]||[];CERT=r[2]||[];lastLoad=Date.now();var selected=E('cat').value||'',cats=[...new Set(G.map(function(g){return g.category||''}).filter(Boolean))];E('cat').innerHTML='<option value="">Todas las categorías</option>'+cats.map(function(x){return '<option>'+esc(x)+'</option>'}).join('');if(cats.indexOf(selected)>=0)E('cat').value=selected;render()}finally{loading=false}}function vars(id){return V.filter(function(v){return v.product_group_id===id}).sort(function(a,b){return String(a.variant_label||a.variant_code).localeCompare(String(b.variant_label||b.variant_code),'es',{numeric:true})})}
function groupCert(gid){var ids=vars(gid).map(function(v){return v.product_id});return CERT.find(function(c){return ids.indexOf(c.product_id)>=0})||null}
function openDoc(url){if(!url)return;var u=String(url);if(/^https?:\/\//i.test(u)&&u.indexOf(location.origin)!==0){alert('Documento externo no habilitado. Debe estar asociado a una ruta MSC Safety.');return}window.open(u,'_blank','noopener')}function render(){var q=(E('q').value||'').toLowerCase(),cat=E('cat').value||'',list=G.filter(function(g){var text=[g.name,g.brand,g.model,g.group_key].concat(vars(g.product_group_id).map(function(v){return [v.sku,v.variant_label,v.ean_gtin].join(' ')})).join(' ').toLowerCase();return(!q||text.indexOf(q)>=0)&&(!cat||g.category===cat)});var shownVariants=list.reduce(function(a,g){return a+vars(g.product_group_id).length},0),published=V.filter(function(v){return v.active!==false&&v.catalog_visible}).length;E('summary').innerHTML='<span><b>'+list.length+'</b> de '+G.length+' modelos</span><span><b>'+shownVariants+'</b> productos / variantes mostradas</span><span><b>'+published+'</b> variantes publicadas en web</span><span>Actualizado '+new Date(lastLoad).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})+'</span>';E('groups').innerHTML=list.length?list.map(function(g){var vv=vars(g.product_group_id),isopen=!!open[g.product_group_id],img=g.image_url||'',stock=Number(g.available_stock||0);return '<section class="group"><div class="head" data-open="'+g.product_group_id+'"><div class="pic">'+(img?'<img src="'+esc(img)+'">':'MSC')+'</div><div><div class="name">'+esc(g.name)+'</div><div class="meta">'+esc([g.brand,g.model,g.category].filter(Boolean).join(' · '))+'</div><div class="stats"><span class="pill">'+vv.length+' variantes</span><span class="pill '+(stock>0?'ok':stock<0?'bad':'')+'">Disponible '+stock.toLocaleString('es-CL')+'</span><span class="pill">Físico '+Number(g.physical_stock||0).toLocaleString('es-CL')+'</span></div></div><div style="font-size:22px;color:#0f5b6e">'+(isopen?'⌃':'⌄')+'</div></div>'+(isopen?'<div class="body">'+(function(){var cert=groupCert(g.product_group_id),doc=g.datasheet_url||'';return '<div class="docs">'+(doc?'<button type="button" data-open-doc="'+esc(doc)+'">Abrir ficha técnica</button>':'<span class="pending">Ficha pendiente</span>')+(cert&&cert.document_url?'<button type="button" data-open-doc="'+esc(cert.document_url)+'">'+esc([cert.certification_type,cert.certificate_number].filter(Boolean).join(' · ')||'Certificación')+'</button>':(cert?'<span class="pending">'+esc(cert.certification_type||'Certificación')+' · documento exacto en validación</span>':'<span class="pending">Certificación pendiente</span>'))+'</div>'})()+'<div class="editgrid"><input data-name="'+g.product_group_id+'" value="'+esc(g.name)+'" placeholder="Nombre padre"><input data-cat="'+g.product_group_id+'" value="'+esc(g.category||'')+'" placeholder="Categoría"><select data-type="'+g.product_group_id+'"><option '+(g.variant_type_1==='Talla'?'selected':'')+'>Talla</option><option '+(g.variant_type_1==='Variante'?'selected':'')+'>Variante</option><option '+(g.variant_type_1==='Color'?'selected':'')+'>Color</option></select><button class="btn" data-save="'+g.product_group_id+'">Guardar padre</button></div><div class="variants"><table><thead><tr><th>Variante</th><th>SKU</th><th>EAN</th><th>Físico</th><th>Comprometido</th><th>Disponible</th><th>Venta neta</th><th>Catálogo</th></tr></thead><tbody>'+vv.map(function(v){return '<tr><td><b>'+esc(v.variant_label||v.variant_code||'Única')+'</b></td><td class="sku">'+esc(v.sku||'')+'</td><td>'+esc(v.ean_gtin||'—')+'</td><td>'+Number(v.physical_stock||0).toLocaleString('es-CL')+'</td><td>'+Number(v.committed_stock||0).toLocaleString('es-CL')+'</td><td class="'+(Number(v.available_stock||0)>0?'ok':Number(v.available_stock||0)<0?'bad':'')+'"><b>'+Number(v.available_stock||0).toLocaleString('es-CL')+'</b></td><td>'+money(v.sale_price||0)+'</td><td>'+(v.catalog_visible?'Publicado':'Interno')+'</td></tr>'}).join('')+'</tbody></table></div></div>':'')+'</section>'}).join(''):'<div class="empty">No hay coincidencias.</div>';document.querySelectorAll('[data-open]').forEach(function(x){x.onclick=function(e){if(e.target.closest('[data-save]'))return;open[x.dataset.open]=!open[x.dataset.open];render()}});document.querySelectorAll('[data-open-doc]').forEach(function(b){b.onclick=function(e){e.stopPropagation();openDoc(b.dataset.openDoc)}});document.querySelectorAll('[data-save]').forEach(function(b){b.onclick=async function(e){e.stopPropagation();var id=b.dataset.save,body={name:document.querySelector('[data-name="'+id+'"]').value.trim(),category:document.querySelector('[data-cat="'+id+'"]').value.trim()||null,variant_type_1:document.querySelector('[data-type="'+id+'"]').value,updated_at:new Date().toISOString()};try{await api('/rest/v1/msc_product_groups?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});await load()}catch(err){alert(err.message)}}})}E('q').oninput=render;E('cat').onchange=render;E('refresh').onclick=function(){load(true)};window.addEventListener('focus',function(){if(token)load(false)});document.addEventListener('visibilitychange',function(){if(!document.hidden&&token)load(false)});E('logout').onclick=function(){sessionStorage.removeItem('msc_token');location.reload()};E('loginForm').onsubmit=async function(e){e.preventDefault();try{var r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:E('email').value,password:E('password').value})}),d=await r.json();if(!r.ok)throw Error('Credenciales no válidas');token=d.access_token;sessionStorage.setItem('msc_token',token);await enter()}catch(x){E('loginMsg').textContent=x.message}};(async function(){try{await cfg();if(token)await enter()}catch(e){E('loginMsg').textContent=e.message}})()})();</script></body></html>
