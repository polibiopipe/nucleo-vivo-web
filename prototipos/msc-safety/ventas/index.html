<!doctype html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c91f2b">
<title>MSC Safety · Ventas</title>
<style>
:root{--red:#c91f2b;--blue:#0f5b6e;--ink:#202326;--muted:#727980;--line:#d9dde1;--soft:#f3f4f5;--ok:#209653;--bad:#c43c36}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:15px/1.3 Arial,sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{max-width:390px;margin:10vh auto;padding:22px}.login input{width:100%;padding:12px;margin:6px 0;border:1px solid #cfd4d8;border-radius:8px}.primary{border:0;border-radius:8px;background:var(--blue);color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}.login .primary{width:100%;margin-top:7px}.app{min-height:100vh}.top{position:sticky;top:0;z-index:30;background:var(--red);color:#fff}.topline{height:54px;display:flex;align-items:center;padding:0 14px;gap:10px}.brand{font-weight:900}.grow{flex:1}.logout,.mini{border:0;background:#fff2;color:#fff;padding:8px 10px;border-radius:7px}.tabs{display:flex;gap:6px;overflow:auto;padding:0 10px 10px}.tabs button{border:0;border-radius:18px;padding:8px 13px;background:#fff3;color:#fff;font-weight:700;white-space:nowrap}.tabs button.active{background:#fff;color:#26353b}.main{padding-bottom:74px}.view{display:none}.view.active{display:block}.bar{display:flex;gap:8px;padding:8px 10px;background:#eef0f1;border-bottom:1px solid var(--line);position:sticky;top:98px;z-index:20}.bar input,.bar select{height:40px;border:1px solid #cfd4d8;border-radius:8px;background:#fff;padding:0 10px}.bar input{flex:1;min-width:0}.bar select{max-width:40%}.group{border-bottom:1px solid var(--line);background:#fff}.groupHead{display:grid;grid-template-columns:68px 1fr auto;gap:10px;align-items:center;padding:9px 10px;cursor:pointer}.thumb{width:68px;height:68px;border:1px solid #e1e4e7;background:#f6f6f6;display:grid;place-items:center;overflow:hidden;font-size:10px}.thumb img{width:100%;height:100%;object-fit:contain}.name{font-weight:800;font-size:15px}.meta,.sku,.stock,.small{font-size:11px;color:var(--muted)}.price{font-weight:800;color:var(--red);margin-top:2px}.openBtn{border:0;background:var(--blue);color:#fff;border-radius:18px;padding:8px 11px;font-weight:700;cursor:pointer;white-space:nowrap}.client{display:grid;grid-template-columns:1fr auto;padding:12px 14px;gap:10px;border-bottom:1px solid var(--line)}.client.active{background:#fff7dc}.client h3{margin:0 0 3px;font-size:15px}.client p{margin:2px 0;color:var(--muted);font-size:12px}.section{padding:12px}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px;margin-bottom:10px}.card h2,.card h3{margin:0 0 10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:4px}.field label{font-size:10px;color:var(--muted);text-transform:uppercase}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #ccd2d6;border-radius:7px;background:#fff}.full{grid-column:1/-1}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.metric{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px}.metric span{display:block;color:var(--muted);font-size:10px}.metric b{display:block;font-size:17px;margin-top:3px}.cartline{display:grid;grid-template-columns:1fr 70px 90px 70px 28px;gap:6px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.cartline input{width:100%;padding:7px;border:1px solid #ccd2d6;border-radius:6px}.remove{border:0;background:transparent;color:var(--bad);font-size:20px}.totals{margin-top:12px;border-top:2px solid #e6e9eb;padding-top:8px}.totals div{display:flex;justify-content:space-between;padding:5px 0}.totals div:last-child{font-size:21px;font-weight:900}.empty{padding:30px 16px;text-align:center;color:var(--muted)}.notice{padding:10px 12px;background:#fff4d9;border:1px solid #ead08b;border-radius:8px;margin-bottom:10px}.ok{color:var(--ok)}.bad{color:var(--bad)}.historyFilters{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px}.historyFilters input,.historyFilters select{padding:9px;border:1px solid #ccd2d6;border-radius:7px}.hist{padding:12px 14px;border-bottom:1px solid var(--line)}.bottom{position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:40}.bottom button{border:0;background:#fff;color:#727980;font-size:10px;font-weight:700}.bottom button.active{color:var(--blue)}.bottom b{display:block;font-size:20px}.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;position:absolute;margin:-7px 0 0 -4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:90;display:none;align-items:stretch;justify-content:center}.modal.show{display:flex}.sheet{background:#fff;width:min(760px,100%);height:100%;display:flex;flex-direction:column}.sheetTop{background:var(--red);color:#fff;padding:10px 14px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}.sheetTop button{border:0;background:transparent;color:#fff;font-weight:700;padding:10px}.sheetTitle{text-align:center;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sheetHero{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}.sheetHero .thumb{width:86px;height:86px}.sheetHero h2{margin:3px 0 4px;font-size:20px}.variantHeader{display:grid;grid-template-columns:1fr 88px 88px;padding:8px 14px;background:#eef0f1;color:#555;font-size:11px;font-weight:700}.variantList{flex:1;overflow:auto}.modalVariant{display:grid;grid-template-columns:1fr 88px 88px;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}.modalVariant input{width:100%;padding:9px;border:1px solid #ccd2d6;border-radius:7px;text-align:center}.modalFoot{padding:12px 14px;border-top:1px solid var(--line);background:#fff}.modalFoot .primary{width:100%;font-size:16px;padding:13px}.selectedCount{text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}.full{grid-column:auto}.metrics{grid-template-columns:1fr 1fr}.cartline{grid-template-columns:1fr 58px 72px 55px 24px}.historyFilters{grid-template-columns:1fr 1fr}.historyFilters select,.historyFilters button{grid-column:1/-1}.groupHead{grid-template-columns:58px 1fr auto}.thumb{width:58px;height:58px}.sheet{width:100%}.sheetHero{grid-template-columns:72px 1fr}.sheetHero .thumb{width:72px;height:72px}.modalVariant,.variantHeader{grid-template-columns:1fr 72px 74px;padding-left:10px;padding-right:10px}}
@media(min-width:900px){.main{max-width:1050px;margin:auto}.bottom{left:50%;transform:translateX(-50%);max-width:1050px}.sheet{height:min(820px,94vh);margin:auto;border-radius:12px;overflow:hidden}}
</style>
</head>
<body>
<section id="login" class="login"><h2>MSC Safety · Ventas</h2><form id="loginForm"><input id="email" type="email" placeholder="Correo" required><input id="password" type="password" placeholder="Contraseña" required><button class="primary">Ingresar</button></form><div id="loginMsg" class="small"></div></section>
<section id="app" class="app hidden">
<header class="top"><div class="topline"><div class="brand">MSC SAFETY · VENTAS</div><div class="grow"></div><span id="role" class="small" style="color:#fff"></span><button id="logout" class="logout">Salir</button></div><div class="tabs"><button data-view="catalogo" class="active">Catálogo</button><button data-view="clientes">Clientes</button><button data-view="historial">Historial</button><button data-view="pedido">Pedido <span id="topBadge"></span></button></div></header>
<main class="main">
<section id="v-catalogo" class="view active"><div class="bar"><input id="searchProduct" placeholder="Buscar modelo, producto, SKU o talla"><select id="category"><option value="">Todas</option></select></div><div id="products"><div class="empty">Cargando…</div></div></section>
<section id="v-clientes" class="view"><div class="section"><div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><h2>Clientes</h2><div class="small">Selecciona un cliente o crea uno nuevo.</div></div><button id="toggleNewClient" class="primary">Cliente nuevo</button></div></div><div id="newClientBox" class="card hidden"><h3>Nuevo cliente</h3><form id="customerForm" class="grid2"><div class="field"><label>RUT</label><input name="rut"></div><div class="field"><label>Razón social</label><input name="name" required></div><div class="field"><label>Dirección</label><input name="address"></div><div class="field"><label>Ciudad</label><input name="city"></div><div class="field"><label>Contacto</label><input name="contact_name"></div><div class="field"><label>Fono</label><input name="phone"></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>Giro</label><input name="business_activity"></div><div class="field"><label>Cupo crédito</label><input name="credit_limit" type="number" min="0"></div><div class="field"><label>Condición de pago</label><input name="payment_terms"></div><div class="field"><label>Descuento base %</label><input name="default_discount_percent" type="number" min="0" step="0.01" value="0"></div><div class="field full"><label>Observaciones</label><textarea name="notes" rows="2"></textarea></div><div class="full"><button class="primary">Guardar cliente</button></div></form><div id="customerMsg" class="small"></div></div><div class="card"><input id="searchClient" style="width:100%;padding:10px;border:1px solid #ccd2d6;border-radius:7px" placeholder="Buscar cliente o RUT"></div><div id="clientDetail"></div><div id="clients"></div></div></section>
<section id="v-historial" class="view"><div class="section"><div class="card"><h2>Historial</h2><div class="historyFilters"><select id="histClient"><option value="">Todos los clientes</option></select><input id="histFrom" type="date"><input id="histTo" type="date"><button id="applyHistory" class="primary">Ver historial</button></div></div><div id="history" class="card"></div></div></section>
<section id="v-pedido" class="view"><div class="section"><div class="card"><h2>Nueva venta</h2><div class="field"><label>Cliente</label><select id="orderCustomer"></select></div><div id="orderClientInfo" class="notice">Seleccione un cliente.</div></div><div class="card"><h3>Productos del pedido</h3><div id="cart"></div></div><div class="card"><div class="grid2"><div class="field"><label>Fecha estimada despacho</label><input id="dispatchDate" type="date"></div><div class="field"><label>Observación</label><input id="orderNotes"></div></div><div class="totals"><div><span>Neto</span><b id="net">$0</b></div><div><span>IVA 19%</span><b id="tax">$0</b></div><div><span>Total</span><b id="gross">$0</b></div></div><button id="confirmOrder" class="primary" style="width:100%;margin-top:12px">Crear venta / pedido</button><div id="orderMsg" class="small"></div></div></div></section>
</main>
<nav class="bottom"><button data-view="catalogo" class="active"><b>▦</b>Catálogo</button><button data-view="clientes"><b>♙</b>Clientes</button><button data-view="historial"><b>↺</b>Historial</button><button data-view="pedido"><b>🛒</b>Pedido <span id="badge" class="badge hidden">0</span></button></nav>
</section>
<div id="variantModal" class="modal" aria-hidden="true"><div class="sheet"><div class="sheetTop"><button id="closeVariants">Cerrar</button><div id="variantModalTitle" class="sheetTitle">Variantes</div><button id="clearVariantQty">Limpiar</button></div><div id="variantHero" class="sheetHero"></div><div class="variantHeader"><span>Variante / SKU / Stock</span><span>Precio</span><span>Cantidad</span></div><div id="variantList" class="variantList"></div><div class="modalFoot"><div id="variantSelectedCount" class="selectedCount">No hay unidades seleccionadas</div><button id="addVariantsToCart" class="primary">Agregar al carro</button></div></div></div>
<script>
(function(){
var BASE='',KEY='',token=sessionStorage.getItem('msc_token')||'',role='',P=[],G=[],C=[],O=[],M=[],K=[],cart=JSON.parse(sessionStorage.getItem('msc_sales_cart')||'[]'),customerId=sessionStorage.getItem('msc_sales_customer')||'',activeGroupId='';
function E(x){return document.getElementById(x)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(v){return '$'+Math.round(Number(v||0)).toLocaleString('es-CL')}
async function cfg(){var t=await fetch('../gestion/').then(function(r){return r.text()});BASE=(t.match(/var SUPABASE_URL='([^']+)'/)||[])[1]||'';KEY=(t.match(/var SUPABASE_KEY='([^']+)'/)||[])[1]||'';if(!BASE||!KEY)throw Error('No se pudo iniciar conexión MSC')}
async function api(path,opt){opt=opt||{};opt.headers=Object.assign({apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},opt.headers||{});var r=await fetch(BASE+path,opt),txt=await r.text(),d=txt?JSON.parse(txt):null;if(!r.ok)throw Error((d&&d.message)||('Error '+r.status));return d}
async function safe(path){try{return await api(path)}catch(e){return []}}
function save(){sessionStorage.setItem('msc_sales_cart',JSON.stringify(cart));if(customerId)sessionStorage.setItem('msc_sales_customer',customerId)}
async function enter(){var r=await fetch(BASE+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+token}}),u=await r.json();if(!r.ok)throw Error('Sesión no válida');role=(u.app_metadata&&u.app_metadata.msc_role)||'';if(['admin','ventas','supervisor','bodega'].indexOf(role)<0)throw Error('Cuenta sin permiso comercial');E('role').textContent=role;E('login').classList.add('hidden');E('app').classList.remove('hidden');await load()}
async function load(){var r=await Promise.all([safe('/rest/v1/msc_products?select=*&order=name'),safe('/rest/v1/msc_product_groups?select=*&active=eq.true&order=name'),safe('/rest/v1/msc_customers?select=*&order=name'),safe('/rest/v1/msc_sales_orders?select=*,msc_customers(name)&order=created_at.desc&limit=300'),safe('/rest/v1/msc_stock_movements?select=product_id,quantity&limit=5000'),safe('/rest/v1/msc_stock_commitments?select=product_id,quantity,status&limit=5000')]);P=(r[0]||[]).filter(function(x){return x.active!==false});G=r[1]||[];C=(r[2]||[]).filter(function(x){return x.active!==false});O=r[3]||[];M=r[4]||[];K=(r[5]||[]).filter(function(x){return x.status==='activo'});renderAll()}
function physical(id){return M.filter(function(x){return x.product_id===id}).reduce(function(a,x){return a+Number(x.quantity||0)},0)}
function committed(id){return K.filter(function(x){return x.product_id===id}).reduce(function(a,x){return a+Number(x.quantity||0)},0)}
function available(id){return physical(id)-committed(id)}
function variants(gid){return P.filter(function(p){return p.product_group_id===gid})}
function selectedClient(){return C.find(function(x){return x.id===customerId})||null}
function orderSumForCustomer(id){return O.filter(function(o){return o.customer_id===id&&['borrador','confirmado','preparacion','en_transito'].indexOf(o.status)>=0}).reduce(function(a,o){return a+Number(o.gross_total||0)},0)}
function cartQty(){return cart.reduce(function(a,x){return a+Number(x.quantity||0)},0)}
function cartNet(){return cart.reduce(function(a,x){return a+Number(x.quantity||0)*Number(x.unit_price||0)*(1-Number(x.discount_percent||0)/100)},0)}
function uniqueRef(){return 'PED-'+new Date().toISOString().replace(/[-:TZ.]/g,'').slice(2,14)+'-'+Math.floor(Math.random()*90+10)}
function go(v){document.querySelectorAll('[data-view]').forEach(function(b){b.classList.toggle('active',b.dataset.view===v)});document.querySelectorAll('.view').forEach(function(s){s.classList.remove('active')});E('v-'+v).classList.add('active');if(v==='catalogo')renderProducts();if(v==='clientes')renderClients();if(v==='historial')renderHistory();if(v==='pedido')renderCart()}
function renderAll(){var cats=[...new Set(G.map(function(g){return g.category||''}).filter(Boolean))];E('category').innerHTML='<option value="">Todas</option>'+cats.map(function(x){return '<option>'+esc(x)+'</option>'}).join('');var opts='<option value="">Seleccione cliente</option>'+C.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('');E('orderCustomer').innerHTML=opts;E('histClient').innerHTML='<option value="">Todos los clientes</option>'+C.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('');if(customerId)E('orderCustomer').value=customerId;renderProducts();renderClients();renderHistory();renderCart()}
function renderProducts(){var q=(E('searchProduct').value||'').toLowerCase(),cat=E('category').value||'';var list=G.filter(function(g){var vv=variants(g.id),text=[g.name,g.brand,g.model,g.group_key].concat(vv.map(function(p){return [p.sku,p.name,p.variant_label,p.variant_code,p.ean_gtin].join(' ')})).join(' ').toLowerCase();return(!q||text.indexOf(q)>=0)&&(!cat||g.category===cat)});E('products').innerHTML=list.length?list.map(function(g){var vv=variants(g.id),total=vv.reduce(function(a,p){return a+available(p.id)},0),prices=vv.map(function(p){return Number(p.sale_price||0)}).filter(Boolean),min=prices.length?Math.min.apply(null,prices):0,img=g.image_url||(vv[0]&&vv[0].catalog_image_url)||'';return '<div class="group"><div class="groupHead" data-open-group="'+g.id+'"><div class="thumb">'+(img?'<img src="'+esc(img)+'">':'MSC')+'</div><div><div class="name">'+esc(g.name)+'</div><div class="meta">'+esc([g.brand,g.model,vv.length+' variantes'].filter(Boolean).join(' · '))+'</div><div class="price">'+(min?'Desde '+money(min*1.19):'Precio por definir')+'</div><div class="stock '+(total>0?'ok':total<0?'bad':'')+'">Stock grupo: '+total.toLocaleString('es-CL')+'</div></div><button class="openBtn" data-open-group="'+g.id+'">Ver</button></div></div>'}).join(''):'<div class="empty">No hay productos para mostrar.</div>';document.querySelectorAll('[data-open-group]').forEach(function(x){x.onclick=function(e){e.stopPropagation();openVariantModal(x.dataset.openGroup)}})}
function openVariantModal(gid){var g=G.find(function(x){return x.id===gid});if(!g)return;activeGroupId=gid;var vv=variants(gid).sort(function(a,b){return String(a.variant_label||a.variant_code).localeCompare(String(b.variant_label||b.variant_code),'es',{numeric:true})}),img=g.image_url||(vv[0]&&vv[0].catalog_image_url)||'';E('variantModalTitle').textContent=g.name;E('variantHero').innerHTML='<div class="thumb">'+(img?'<img src="'+esc(img)+'">':'MSC')+'</div><div><h2>'+esc(g.name)+'</h2><div class="meta">'+esc([g.brand,g.model,vv.length+' variantes'].filter(Boolean).join(' · '))+'</div><div class="small">Selecciona cantidades por '+esc((g.variant_type_1||'variante').toLowerCase())+'.</div></div>';E('variantList').innerHTML=vv.map(function(p){var s=available(p.id),lab=p.variant_label||p.variant_code||'Única',net=Number(p.sale_price||0);return '<div class="modalVariant"><div><b>'+esc((g.variant_type_1||'Variante')+' '+lab)+'</b><div class="sku">'+esc(p.sku||'')+(p.ean_gtin?' · EAN '+esc(p.ean_gtin):'')+'</div><div class="stock '+(s>0?'ok':s<0?'bad':'')+'">Disponible: '+s.toLocaleString('es-CL')+'</div></div><div class="price">'+(net?money(net*1.19):'—')+'</div><input class="variantQty" data-product="'+p.id+'" type="number" min="0" step="1" value="0" inputmode="numeric"></div>'}).join('');E('variantModal').classList.add('show');E('variantModal').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';bindVariantQty();updateVariantSelectedCount()}
function bindVariantQty(){document.querySelectorAll('.variantQty').forEach(function(i){i.oninput=updateVariantSelectedCount})}
function updateVariantSelectedCount(){var n=0;document.querySelectorAll('.variantQty').forEach(function(i){n+=Math.max(0,Number(i.value||0))});E('variantSelectedCount').textContent=n?(n+' unidades seleccionadas'):'No hay unidades seleccionadas'}
function closeVariantModal(){E('variantModal').classList.remove('show');E('variantModal').setAttribute('aria-hidden','true');document.body.style.overflow='';activeGroupId=''}
function addProduct(id,q){var p=P.find(function(x){return x.id===id});if(!p||q<=0)return;var g=G.find(function(x){return x.id===p.product_group_id}),x=cart.find(function(i){return i.product_id===id});if(x)x.quantity=Number(x.quantity)+q;else cart.push({product_id:id,name:(g?g.name:p.name)+' · '+((g&&g.variant_type_1)||'Variante')+' '+(p.variant_label||p.variant_code||''),sku:p.sku||'',quantity:q,unit_price:Number(p.sale_price||0),discount_percent:Number((selectedClient()&&selectedClient().default_discount_percent)||0)});save()}
E('addVariantsToCart').onclick=function(){var added=0;document.querySelectorAll('.variantQty').forEach(function(i){var q=Math.max(0,Number(i.value||0));if(q>0){addProduct(i.dataset.product,q);added+=q}});if(!added){E('variantSelectedCount').textContent='Selecciona al menos una cantidad.';return}renderCart();updateBadge();closeVariantModal();renderProducts()};
E('closeVariants').onclick=closeVariantModal;E('clearVariantQty').onclick=function(){document.querySelectorAll('.variantQty').forEach(function(i){i.value=0});updateVariantSelectedCount()};E('variantModal').onclick=function(e){if(e.target===E('variantModal'))closeVariantModal()};
function renderClients(){var q=(E('searchClient').value||'').toLowerCase(),L=C.filter(function(c){return !q||[c.name,c.rut,c.contact_name,c.city].join(' ').toLowerCase().indexOf(q)>=0}),c=selectedClient();E('clientDetail').innerHTML=c?clientDetailHtml(c):'';E('clients').innerHTML=L.length?L.map(function(c){return '<div class="client '+(c.id===customerId?'active':'')+'"><div><h3>'+esc(c.name)+'</h3><p>'+esc(c.rut||'')+(c.city?' · '+esc(c.city):'')+'</p><p>'+esc(c.contact_name||'')+(c.phone?' · '+esc(c.phone):'')+'</p></div><button class="primary" data-client="'+c.id+'">'+(c.id===customerId?'Seleccionado':'Usar')+'</button></div>'}).join(''):'<div class="empty">Sin clientes.</div>';document.querySelectorAll('[data-client]').forEach(function(b){b.onclick=function(){customerId=b.dataset.client;save();E('orderCustomer').value=customerId;renderClients();renderCart()}})}
