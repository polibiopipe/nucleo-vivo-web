<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c51f2c"><title>MSC Safety · Ventas</title><style>
:root{--red:#c51f2c;--red2:#e52d3a;--ink:#25282b;--muted:#7e858b;--line:#d9dde1;--soft:#f4f5f6;--blue:#0f5669;--ok:#28a05a;--bad:#d64a43;--white:#fff}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:15px/1.35 system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:#f3f4f5}.loginBox{width:min(390px,100%);background:#fff;border:1px solid #dfe3e6;border-radius:18px;padding:25px;box-shadow:0 18px 60px #0001}.brandmark{display:flex;align-items:center;gap:12px;margin-bottom:18px}.brandmark b{font-size:22px;letter-spacing:.04em}.brandmark span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(145deg,#d5ad55,#674d20);display:grid;place-items:center;color:#111;font-weight:900}.field{display:grid;gap:6px;margin:11px 0}.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.field input{width:100%;padding:12px 13px;border:1px solid #cfd4d8;border-radius:10px;background:#fff;color:#222}.btn{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}.loginBox .btn{width:100%;margin-top:8px}.msg{font-size:12px;color:var(--muted);margin-top:10px}.app{min-height:100vh;background:#fff}.top{position:sticky;top:0;z-index:40;background:var(--red);color:#fff;box-shadow:0 2px 0 #0001}.topline{height:58px;display:flex;align-items:center;gap:10px;padding:0 14px}.title{font-weight:900;letter-spacing:.03em}.sub{font-size:10px;opacity:.8}.grow{flex:1}.logout{border:0;background:#ffffff20;color:#fff;padding:8px 10px;border-radius:8px}.tabs{display:flex;overflow:auto;background:var(--red);padding:0 10px 10px;gap:5px}.tabs button{flex:0 0 auto;border:0;background:#fff3;color:#fff;border-radius:18px;padding:8px 13px;font-weight:700}.tabs button.active{background:#fff;color:#29404a}.toolbar{position:sticky;top:105px;z-index:30;display:flex;gap:8px;padding:8px 10px;background:#f0f1f2;border-bottom:1px solid var(--line)}.toolbar input,.toolbar select{height:40px;border:1px solid #cfd4d8;border-radius:9px;background:#fff;padding:0 11px}.toolbar input{flex:1;min-width:0}.toolbar select{max-width:42%}.main{padding:0 0 84px}.view{display:none}.view.active{display:block}.list{background:#fff}.productRow,.clientRow,.histRow{display:grid;align-items:center;border-bottom:1px solid var(--line);background:#fff}.productRow{grid-template-columns:72px 1fr auto;min-height:92px;padding:7px 10px;gap:10px}.thumb{width:72px;height:72px;background:#f3f4f5;border:1px solid #e1e4e7;border-radius:7px;display:grid;place-items:center;overflow:hidden;color:#9aa0a6;font-size:10px}.thumb img{width:100%;height:100%;object-fit:contain}.prodName{font-weight:850;font-size:15px;line-height:1.15;margin-bottom:4px}.brand{color:var(--muted);font-size:11px}.sku{color:#5f666b;font-size:11px;margin-top:4px}.price{color:var(--red);font-weight:850;margin-top:4px;font-size:14px}.stock{font-size:10px;margin-top:3px}.ok{color:var(--ok)}.bad{color:var(--bad)}.add{width:38px;height:38px;border-radius:19px;border:0;background:var(--blue);color:#fff;font-size:22px;line-height:1}.clientRow{grid-template-columns:1fr auto;padding:13px 15px;gap:10px}.clientRow.selected{background:#fff8e6}.clientRow h3{margin:0 0 4px;font-size:16px}.clientRow p{margin:2px 0;color:var(--muted);font-size:12px}.choose{border:0;background:transparent;color:var(--blue);font-size:24px}.histRow{grid-template-columns:1fr auto;padding:13px 15px;gap:10px}.histRow h3{margin:0 0 3px;font-size:15px}.histRow p{margin:2px 0;color:var(--muted);font-size:12px}.home{padding:12px}.homeCard{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px;background:#fff}.homeCard h2{margin:0 0 8px;font-size:24px}.homeGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:12px}.metric span{display:block;color:var(--muted);font-size:11px}.metric b{font-size:22px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.quick button{padding:14px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:800}.quick button.alt{background:#eef1f2;color:#24414c;border:1px solid var(--line)}.cartWrap{padding:10px}.customerBox{background:#fff7dc;border:1px solid #e7d28c;padding:12px;border-radius:10px;margin-bottom:10px}.cartLine{display:grid;grid-template-columns:1fr 64px 70px 28px;gap:7px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.cartLine b{display:block;font-size:13px}.cartLine small{color:var(--muted)}.cartLine input{width:100%;padding:7px;border:1px solid #ccd2d6;border-radius:7px}.remove{border:0;background:none;color:var(--bad);font-size:20px}.totals{margin-top:12px;border-top:2px solid #e7e9eb;padding-top:8px}.totals div{display:flex;justify-content:space-between;padding:5px 0}.totals div:last-child{font-size:21px;font-weight:900}.confirm{width:100%;margin-top:12px;padding:13px}.empty{padding:36px 20px;text-align:center;color:var(--muted)}.bottom{position:fixed;z-index:50;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}.bottom button{border:0;background:#fff;color:#7a8186;font-size:10px;font-weight:700}.bottom button b{display:block;font-size:21px;line-height:1.1}.bottom button.active{color:var(--blue)}.badge{display:inline-grid;place-items:center;background:var(--red2);color:#fff;border-radius:10px;min-width:18px;height:18px;font-size:10px;padding:0 4px;position:absolute;margin:-8px 0 0 -6px}@media(min-width:760px){.main{max-width:980px;margin:auto}.productRow{grid-template-columns:80px 1fr auto;min-height:100px}.thumb{width:80px;height:80px}.prodName{font-size:16px}.bottom{left:50%;transform:translateX(-50%);max-width:980px;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style></head><body><section id="login" class="login"><div class="loginBox"><div class="brandmark"><div class="logo">MSC</div><div><b>MSC Safety</b><span>Ventas en terreno</span></div></div><form id="loginForm"><div class="field"><label>Correo</label><input id="email" type="email" required></div><div class="field"><label>Contraseña</label><input id="password" type="password" required></div><button class="btn">Ingresar</button></form><div id="loginMsg" class="msg">Acceso comercial MSC Safety.</div></div></section><section id="app" class="app hidden"><header class="top"><div class="topline"><div><div class="title">MSC SAFETY</div><div class="sub">VENTAS EN TERRENO</div></div><div class="grow"></div><span id="who" class="sub"></span><button id="logout" class="logout">Salir</button></div><div class="tabs"><button class="active" data-view="inicio">Inicio</button><button data-view="catalogo">Catálogo</button><button data-view="clientes">Clientes</button><button data-view="historial">Historial</button><button data-view="carrito">Pedido</button></div></header><main class="main"><section id="v-inicio" class="view active"><div class="home"><div class="homeCard"><h2>Venta rápida</h2><div id="activeClient" class="msg">Selecciona un cliente para comenzar.</div><div class="quick"><button data-go="catalogo">Nueva venta</button><button class="alt" data-go="clientes">Elegir cliente</button></div></div><div class="homeGrid"><div class="metric"><span>Productos</span><b id="kp">0</b></div><div class="metric"><span>Clientes</span><b id="kc">0</b></div><div class="metric"><span>Pedidos</span><b id="ko">0</b></div><div class="metric"><span>Carrito</span><b id="kk">0</b></div></div></div></section><section id="v-catalogo" class="view"><div class="toolbar"><input id="pq" placeholder="Buscar producto, SKU o talla"><select id="cat"><option value="">Todas</option></select></div><div id="products" class="list"></div></section><section id="v-clientes" class="view"><div class="toolbar"><input id="cq" placeholder="Buscar cliente o RUT"></div><div id="clients" class="list"></div></section><section id="v-historial" class="view"><div id="history" class="list"></div></section><section id="v-carrito" class="view"><div class="cartWrap"><div id="customer" class="customerBox"></div><div id="cart"></div><div class="totals"><div><span>Neto</span><b id="net">$0</b></div><div><span>IVA 19%</span><b id="tax">$0</b></div><div><span>Total</span><b id="gross">$0</b></div></div><button id="confirm" class="btn confirm">Confirmar pedido</button><div id="orderMsg" class="msg"></div></div></section></main><nav class="bottom"><button class="active" data-view="inicio"><b>⌂</b>Inicio</button><button data-view="catalogo"><b>▦</b>Catálogo</button><button data-view="clientes"><b>♙</b>Clientes</button><button data-view="historial"><b>↺</b>Historial</button><button data-view="carrito"><b>🛒</b>Pedido <span id="badge" class="badge hidden">0</span></button></nav></section><script>
(function(){var BASE='',KEY='',token=sessionStorage.getItem('msc_token')||'',role='',products=[],customers=[],orders=[],moves=[],commits=[];var customerId=sessionStorage.getItem('msc_sales_customer')||'',cart=JSON.parse(sessionStorage.getItem('msc_sales_cart')||'[]');function E(x){return document.getElementById(x)}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function money(v){return '$'+Math.round(Number(v||0)).toLocaleString('es-CL')}async function config(){var t=await fetch('../gestion/').then(function(r){return r.text()});BASE=(t.match(/var SUPABASE_URL='([^']+)'/)||[])[1]||'';KEY=(t.match(/var SUPABASE_KEY='([^']+)'/)||[])[1]||'';if(!BASE||!KEY)throw new Error('No fue posible iniciar la conexión MSC.')}async function api(path,opt){opt=opt||{};opt.headers=Object.assign({'apikey':KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'},opt.headers||{});var r=await fetch(BASE+path,opt),txt=await r.text(),d=txt?JSON.parse(txt):null;if(!r.ok)throw new Error((d&&d.message)||'Error '+r.status);return d}async function login(u,p){var r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email:u,password:p})}),d=await r.json();if(!r.ok)throw new Error('Credenciales no válidas.');token=d.access_token;sessionStorage.setItem('msc_token',token);await enter()}async function enter(){var r=await fetch(BASE+'/auth/v1/user',{headers:{'apikey':KEY,'Authorization':'Bearer '+token}}),u=await r.json();if(!r.ok)throw new Error('Sesión no válida.');role=(u.app_metadata&&u.app_metadata.msc_role)||'';if(['admin','ventas','supervisor','bodega'].indexOf(role)<0)throw new Error('Cuenta sin permiso comercial.');E('login').classList.add('hidden');E('app').classList.remove('hidden');E('who').textContent=role;await load()}async function load(){var r=await Promise.all([api('/rest/v1/msc_products?select=*&active=eq.true&order=name'),api('/rest/v1/msc_customers?select=*&order=name'),api('/rest/v1/msc_sales_orders?select=*,msc_customers(name),msc_sales_order_lines(*,msc_products(sku,name))&order=created_at.desc&limit=100'),api('/rest/v1/msc_stock_movements?select=product_id,quantity&limit=5000'),api('/rest/v1/msc_stock_commitments?select=product_id,quantity,status&status=eq.activo&limit=5000')]);products=r[0]||[];customers=r[1]||[];orders=r[2]||[];moves=r[3]||[];commits=r[4]||[];render()}function physical(id){return moves.filter(function(x){return x.product_id===id}).reduce(function(a,x){return a+Number(x.quantity||0)},0)}function committed(id){return commits.filter(function(x){return x.product_id===id&&x.status==='activo'}).reduce(function(a,x){return a+Number(x.quantity||0)},0)}function available(id){return physical(id)-committed(id)}function C(){return customers.find(function(x){return x.id===customerId})||null}function save(){sessionStorage.setItem('msc_sales_cart',JSON.stringify(cart));if(customerId)sessionStorage.setItem('msc_sales_customer',customerId)}function qty(){return cart.reduce(function(a,x){return a+Number(x.quantity||0)},0)}function net(){return cart.reduce(function(a,x){return a+Number(x.quantity)*Number(x.unit_price)*(1-Number(x.discount||0)/100)},0)}function go(v){document.querySelectorAll('[data-view]').forEach(function(b){b.classList.toggle('active',b.dataset.view===v)});document.querySelectorAll('.view').forEach(function(x){x.classList.remove('active')});E('v-'+v).classList.add('active');if(v==='catalogo')renderProducts();if(v==='clientes')renderClients();if(v==='historial')renderHistory();if(v==='carrito')renderCart()}function render(){E('kp').textContent=products.length;E('kc').textContent=customers.length;E('ko').textContent=orders.length;E('kk').textContent=qty();var c=C();E('activeClient').textContent=c?'Cliente activo: '+c.name:'Selecciona un cliente para comenzar.';var cats=[...new Set(products.map(function(p){return p.catalog_category||p.family_code||''}).filter(Boolean))].sort();E('cat').innerHTML='<option value="">Todas</option>'+cats.map(function(x){return '<option>'+esc(x)+'</option>'}).join('');renderProducts();renderClients();renderHistory();renderCart()}function renderProducts(){var q=(E('pq').value||'').toLowerCase(),cat=E('cat').value;var list=products.filter(function(p){var s=[p.sku,p.name,p.brand,p.model,p.manufacturer_code,p.variant_code,p.ean_gtin].join(' ').toLowerCase();var pc=p.catalog_category||p.family_code||'';return(!q||s.indexOf(q)>=0)&&(!cat||pc===cat)});E('products').innerHTML=list.length?list.map(function(p){var av=available(p.id),img=p.catalog_image_url||'',gross=p.sale_price==null?null:Number(p.sale_price)*1.19;return '<div class="productRow"><div class="thumb">'+(img?'<img src="'+esc(img)+'" alt="">':'SIN FOTO')+'</div><div><div class="prodName">'+esc(p.name)+'</div><div class="brand">'+esc([p.brand,p.model,p.variant_code?('Talla '+p.variant_code):''].filter(Boolean).join(' · '))+'</div><div class="sku">'+esc(p.sku||'')+'</div><div class="price">'+(gross==null?'Precio no definido':money(gross)+' c/IVA')+'</div><div class="stock '+(av>0?'ok':'bad')+'">'+(av>0?('Disponible: '+av):'Sin stock disponible')+'</div></div><button class="add" data-add="'+p.id+'" '+(av<=0||p.sale_price==null?'disabled':'')+'>+</button></div>'}).join(''):'<div class="empty">No hay productos para este filtro.</div>';E('products').querySelectorAll('[data-add]').forEach(function(b){b.onclick=function(){add(b.dataset.add)}})}function add(id){var p=products.find(function(x){return x.id===id});if(!p)return;var x=cart.find(function(a){return a.product_id===id});if(x)x.quantity+=1;else cart.push({product_id:id,name:p.name,sku:p.sku,quantity:1,unit_price:Number(p.sale_price||0),discount:Number((C()&&C().default_discount_percent)||0)});save();render();go('carrito')}function renderClients(){var q=(E('cq').value||'').toLowerCase();var list=customers.filter(function(c){return [c.name,c.rut,c.contact_name,c.email].join(' ').toLowerCase().indexOf(q)>=0});E('clients').innerHTML=list.length?list.map(function(c){return '<div class="clientRow '+(c.id===customerId?'selected':'')+'"><div><h3>'+esc(c.name)+'</h3><p>'+esc(c.rut||'')+'</p><p>'+esc([c.contact_name,c.email].filter(Boolean).join(' · '))+'</p></div><button class="choose" data-client="'+c.id+'">›</button></div>'}).join(''):'<div class="empty">No se encontraron clientes.</div>';E('clients').querySelectorAll('[data-client]').forEach(function(b){b.onclick=function(){customerId=b.dataset.client;save();render();go('catalogo')}})}function renderHistory(){E('history').innerHTML=orders.length?orders.map(function(o){return '<div class="histRow"><div><h3>'+esc(o.order_number||'Pedido')+'</h3><p>'+esc(o.msc_customers&&o.msc_customers.name||'Sin cliente')+'</p><p>'+new Date(o.created_at).toLocaleString('es-CL')+'</p></div><div><b>'+money(o.gross_total)+'</b><p>'+esc(o.status||'')+'</p></div></div>'}).join(''):'<div class="empty">Aún no hay pedidos.</div>'}function renderCart(){var c=C();E('customer').innerHTML=c?'<b>'+esc(c.name)+'</b><div class="msg">'+esc(c.rut||'')+'</div>':'<b>Sin cliente seleccionado</b><div class="msg">Ve a Clientes antes de confirmar.</div>';E('cart').innerHTML=cart.length?cart.map(function(x,i){return '<div class="cartLine"><div><b>'+esc(x.name)+'</b><small>'+esc(x.sku||'')+'</small></div><input data-q="'+i+'" type="number" min="1" value="'+x.quantity+'"><input data-d="'+i+'" type="number" min="0" max="100" value="'+x.discount+'"><button class="remove" data-r="'+i+'">×</button></div>'}).join(''):'<div class="empty">El pedido está vacío.</div>';var n=net();E('net').textContent=money(n);E('tax').textContent=money(n*.19);E('gross').textContent=money(n*1.19);E('kk').textContent=qty();E('badge').textContent=qty();E('badge').classList.toggle('hidden',qty()===0);E('cart').querySelectorAll('[data-q]').forEach(function(i){i.onchange=function(){cart[Number(i.dataset.q)].quantity=Math.max(1,Number(i.value||1));save();renderCart()}});E('cart').querySelectorAll('[data-d]').forEach(function(i){i.onchange=function(){cart[Number(i.dataset.d)].discount=Math.max(0,Math.min(100,Number(i.value||0)));save();renderCart()}});E('cart').querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){cart.splice(Number(b.dataset.r),1);save();render();renderCart()}})}async function confirmOrder(){var c=C();if(!c){E('orderMsg').textContent='Selecciona un cliente.';return}if(!cart.length){E('orderMsg').textContent='Agrega productos.';return}for(var i=0;i<cart.length;i++){if(available(cart[i].product_id)<cart[i].quantity){E('orderMsg').textContent='Stock insuficiente para '+cart[i].name;return}}var n=net(),no='PED-'+Date.now().toString().slice(-10);E('orderMsg').textContent='Guardando pedido…';try{var h=await api('/rest/v1/msc_sales_orders?select=*',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({order_number:no,customer_id:c.id,status:'confirmado',net_total:n,tax_total:n*.19,gross_total:n*1.19})});var lines=cart.map(function(x){return{sales_order_id:h[0].id,product_id:x.product_id,quantity:x.quantity,unit_price:x.unit_price,discount_percent:x.discount}});await api('/rest/v1/msc_sales_order_lines',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(lines)});for(var j=0;j<cart.length;j++){var x=cart[j];await api('/rest/v1/msc_stock_commitments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({product_id:x.product_id,quantity:x.quantity,reference:no,customer_name:c.name,status:'activo'})})}cart=[];save();E('orderMsg').textContent='Pedido '+no+' creado.';await load();go('historial')}catch(e){E('orderMsg').textContent=e.message}}document.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){go(b.dataset.view)}});document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){go(b.dataset.go)}});E('pq').oninput=renderProducts;E('cat').onchange=renderProducts;E('cq').oninput=renderClients;E('confirm').onclick=confirmOrder;E('logout').onclick=function(){sessionStorage.removeItem('msc_token');location.reload()};E('loginForm').onsubmit=async function(e){e.preventDefault();E('loginMsg').textContent='Ingresando…';try{await login(E('email').value,E('password').value)}catch(err){E('loginMsg').textContent=err.message}};(async function(){try{await config();if(token)await enter()}catch(e){E('loginMsg').textContent=e.message}})()})();
</script></body></html>
