<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSC Safety · Ventas</title><style>body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#222}header{background:#c51f2c;color:#fff;padding:12px;position:sticky;top:0}nav{display:flex;gap:8px;overflow:auto}button,input,select{font:inherit}.tab{border:0;border-radius:18px;padding:8px 12px}.bar{display:flex;gap:8px;padding:8px;background:#eee;position:sticky;top:88px}.bar input{flex:1}.bar input,.bar select{padding:10px;border:1px solid #ccc;border-radius:8px}.row{display:grid;grid-template-columns:62px 1fr 38px;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid #ddd}.pic{width:62px;height:62px;border:1px solid #ddd;background:#f5f5f5;display:grid;place-items:center;font-size:10px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:contain}.name{font-weight:700}.meta,.sku,.stock{font-size:11px;color:#777}.price{font-size:14px;color:#c51f2c;font-weight:700}.add{width:34px;height:34px;border:0;border-radius:50%;background:#0f5669;color:#fff;font-size:20px}.view{display:none}.view.active{display:block}.empty{padding:30px;text-align:center;color:#777}.error{margin:10px;padding:10px;background:#fff0f0;border:1px solid #e0aaaa;color:#8b2b2b}.login{max-width:360px;margin:12vh auto;padding:20px}.login input{width:100%;padding:11px;margin:6px 0;box-sizing:border-box}.login button{width:100%;padding:11px;background:#0f5669;color:#fff;border:0}.hidden{display:none}</style></head><body><section id="login" class="login"><h2>MSC Safety · Ventas</h2><form id="f"><input id="email" type="email" placeholder="Correo" required><input id="pass" type="password" placeholder="Contraseña" required><button>Ingresar</button></form><div id="msg"></div></section><section id="app" class="hidden"><header><b>MSC SAFETY · VENTAS</b><nav><button class="tab" data-v="catalogo">Catálogo</button><button class="tab" data-v="clientes">Clientes</button><button class="tab" data-v="historial">Historial</button></nav></header><main><section id="catalogo" class="view active"><div class="bar"><input id="q" placeholder="Buscar producto, SKU o talla"><select id="cat"><option value="">Todas</option></select></div><div id="err"></div><div id="products"><div class="empty">Cargando productos…</div></div></section><section id="clientes" class="view"><div id="clients"></div></section><section id="historial" class="view"><div id="orders"></div></section></main></section><script>(function(){var BASE='',KEY='',token=sessionStorage.getItem('msc_token')||'',P=[],C=[],O=[],M=[],K=[];function E(x){return document.getElementById(x)}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}async function cfg(){var t=await fetch('../gestion/').then(function(r){return r.text()});BASE=(t.match(/var SUPABASE_URL='([^']+)'/)||[])[1]||'';KEY=(t.match(/var SUPABASE_KEY='([^']+)'/)||[])[1]||'';if(!BASE||!KEY)throw Error('No se pudo iniciar conexión MSC')}async function api(p){var r=await fetch(BASE+p,{headers:{apikey:KEY,Authorization:'Bearer '+token}}),txt=await r.text(),d=txt?JSON.parse(txt):[];if(!r.ok)throw Error((d&&d.message)||('Error '+r.status));return d}async function safe(p){try{return{ok:1,d:await api(p)}}catch(e){return{ok:0,d:[],e:e.message}}}async function enter(){var r=await fetch(BASE+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+token}});if(!r.ok)throw Error('Sesión no válida');E('login').classList.add('hidden');E('app').classList.remove('hidden');await load()}async function load(){var r=await Promise.all([safe('/rest/v1/msc_products?select=*&order=name'),safe('/rest/v1/msc_customers?select=*&order=name'),safe('/rest/v1/msc_sales_orders?select=*&order=created_at.desc&limit=100'),safe('/rest/v1/msc_stock_movements?select=product_id,quantity&limit=5000'),safe('/rest/v1/msc_stock_commitments?select=product_id,quantity,status&limit=5000')]);P=(r[0].d||[]).filter(function(x){return x.active!==false});C=r[1].d||[];O=r[2].d||[];M=r[3].d||[];K=(r[4].d||[]).filter(function(x){return x.status==='activo'});var f=r.filter(function(x){return !x.ok});E('err').innerHTML=f.length?'<div class="error">'+f.map(function(x){return esc(x.e)}).join(' · ')+'</div>':'';render()}function av(id){var a=M.filter(function(x){return x.product_id===id}).reduce(function(s,x){return s+Number(x.quantity||0)},0),b=K.filter(function(x){return x.product_id===id}).reduce(function(s,x){return s+Number(x.quantity||0)},0);return a-b}function render(){var cats=[...new Set(P.map(function(p){return p.catalog_category||p.family_code||''}).filter(Boolean))];E('cat').innerHTML='<option value="">Todas</option>'+cats.map(function(x){return '<option>'+esc(x)+'</option>'}).join('');rp();E('clients').innerHTML=C.length?C.map(function(c){return '<div class="row" style="grid-template-columns:1fr"><div><div class="name">'+esc(c.name)+'</div><div class="meta">'+esc(c.rut||'')+'</div></div></div>'}).join(''):'<div class="empty">Sin clientes.</div>';E('orders').innerHTML=O.length?O.map(function(o){return '<div class="row" style="grid-template-columns:1fr"><div><div class="name">'+esc(o.order_number||'Pedido')+'</div><div class="meta">'+esc(o.status||'')+'</div></div></div>'}).join(''):'<div class="empty">Sin pedidos.</div>'}function rp(){var q=(E('q').value||'').toLowerCase(),c=E('cat').value||'',L=P.filter(function(p){var t=[p.sku,p.name,p.brand,p.model,p.variant_code].join(' ').toLowerCase(),pc=p.catalog_category||p.family_code||'';return(!q||t.indexOf(q)>=0)&&(!c||pc===c)});E('products').innerHTML=L.length?L.map(function(p){var s=av(p.id),img=p.catalog_image_url||'',price=p.sale_price==null?'Precio por definir':'$'+Math.round(Number(p.sale_price)*1.19).toLocaleString('es-CL');return '<div class="row"><div class="pic">'+(img?'<img src="'+esc(img)+'">':'MSC')+'</div><div><div class="name">'+esc(p.name)+'</div><div class="meta">'+esc([p.brand,p.model,p.variant_code?('Talla '+p.variant_code):''].filter(Boolean).join(' · '))+'</div><div class="sku">'+esc(p.sku||'')+'</div><div class="price">'+price+'</div><div class="stock">Disponible: '+s.toLocaleString('es-CL')+'</div></div><button class="add">+</button></div>'}).join(''):'<div class="empty">No hay productos para mostrar.</div>'}document.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active')});E(b.dataset.v).classList.add('active')}});E('q').oninput=rp;E('cat').onchange=rp;E('f').onsubmit=async function(e){e.preventDefault();E('msg').textContent='Ingresando…';try{var r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:E('email').value,password:E('pass').value})}),d=await r.json();if(!r.ok)throw Error('Credenciales no válidas');token=d.access_token;sessionStorage.setItem('msc_token',token);await enter()}catch(x){E('msg').textContent=x.message}};(async function(){try{await cfg();if(token)await enter()}catch(e){E('msg').textContent=e.message}})()})();</script></body></html>
